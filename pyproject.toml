[project]
name = "cardprint"
version = "0.1.0"
description = "Локальная подготовка копий карточек на листе A4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "PyMuPDF>=1.24,<2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "reportlab>=4.2,<5",
  "numpy>=2.1,<3",
]

[project.scripts]
cardprint = "cardprint.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/cardprint"]
